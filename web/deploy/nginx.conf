# /etc/nginx/sites-available/gurotopia  (then: ln -s ../sites-available/gurotopia /etc/nginx/sites-enabled/)
#
# Port 443 is shared. The game asks for server_data on 443, and the website wants
# HTTPS on 443 too. nginx answers both and tells them apart by hostname:
#   panel.flareps.xyz          -> the website (127.0.0.1:3000), Let's Encrypt certificate
#   anything else (the game)   -> the gateway's own HTTPS listener (127.0.0.1:8443),
#                                 using the game certificate from resources/ctx
# Start the gateway with --https-port 8443 so it doesn't take 443 itself, and keep
# 8443 closed in the firewall.
#
# Change panel.flareps.xyz here if you use another name. Get its certificate first with:
#   certbot certonly --webroot -w /var/www/html -d panel.flareps.xyz

server {
    listen 80;
    listen [::]:80;
    server_name panel.flareps.xyz;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# The website
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.flareps.xyz;

    ssl_certificate     /etc/letsencrypt/live/panel.flareps.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.flareps.xyz/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# The game's login request (server_data.php and the login page it points to)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /opt/gurotopia/resources/ctx/server.crt;
    ssl_certificate_key /opt/gurotopia/resources/ctx/server.key;

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off; # @note our own gateway on the same machine
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
