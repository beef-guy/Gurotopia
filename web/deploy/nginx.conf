# /etc/nginx/sites-available/gurotopia  (then: ln -s ../sites-available/gurotopia /etc/nginx/sites-enabled/)
#
# Port 443 is shared. The game asks for server_data on 443, and the website wants
# HTTPS on 443 too. nginx answers both and tells them apart by hostname:
#   panel.psnode.cloud          -> the website (127.0.0.1:3000), Let's Encrypt certificate
#   anything else (the game)   -> the gateway's own HTTPS listener (127.0.0.1:8443),
#                                 using the game certificate from resources/ctx
# Start the gateway with --https-port 8443 so it doesn't take 443 itself, and keep
# 8443 closed in the firewall.
#
# Change panel.psnode.cloud here if you use another name. Get its certificate first with:
#   certbot certonly --webroot -w /var/www/html -d panel.psnode.cloud

server {
    listen 80;
    listen [::]:80;
    server_name panel.psnode.cloud;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    # @note also on plain HTTP, in case the client asks without TLS.
    # Custom item textures (the Resources page). The game client downloads files it doesn't have from
    # /cdn/<server id>/cache/...; a server's own upload is served from CDN_DIR, and anything else
    # (Growtopia's own files) is fetched from Growtopia's CDN.
    location /cdn/ {
        root /srv/gurotopia/www;
        try_files $uri @growtopia_cdn;
        add_header Cache-Control "public, max-age=31536000, immutable"; # @note names change with the picture
    }
    location @growtopia_cdn {
        rewrite ^/cdn/[0-9]+/cache/(.*)$ /0098/01020126/cache/$1 break;
        proxy_pass https://ubistatic-a.akamaihd.net;
        proxy_set_header Host ubistatic-a.akamaihd.net;
        proxy_ssl_server_name on;
    }
    location / { return 301 https://$host$request_uri; }
}

# psnode.cloud and www go to the website
server {
    listen 80;
    listen [::]:80;
    server_name psnode.cloud www.psnode.cloud;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://panel.psnode.cloud$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name psnode.cloud www.psnode.cloud;
    ssl_certificate     /etc/letsencrypt/live/psnode.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psnode.cloud/privkey.pem;
    return 301 https://panel.psnode.cloud$request_uri;
}

# The website
server {
    listen 443 ssl; # @note no "http2 on": nginx 1.24 (Ubuntu 24.04) doesn't know it
    listen [::]:443 ssl;
    server_name panel.psnode.cloud;

    ssl_certificate     /etc/letsencrypt/live/panel.psnode.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.psnode.cloud/privkey.pem;

    client_max_body_size 4m; # @note a 2 MB texture upload arrives as base64

    # Custom item textures (the Resources page). The game client downloads files it doesn't have from
    # /cdn/<server id>/cache/...; a server's own upload is served from CDN_DIR, and anything else
    # (Growtopia's own files) is fetched from Growtopia's CDN.
    location /cdn/ {
        root /srv/gurotopia/www;
        try_files $uri @growtopia_cdn;
        add_header Cache-Control "public, max-age=31536000, immutable"; # @note names change with the picture
    }
    location @growtopia_cdn {
        rewrite ^/cdn/[0-9]+/cache/(.*)$ /0098/01020126/cache/$1 break;
        proxy_pass https://ubistatic-a.akamaihd.net;
        proxy_set_header Host ubistatic-a.akamaihd.net;
        proxy_ssl_server_name on;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# The game's login page (loginurl|login.psnode.cloud in the gateway's server_data.php)
server {
    listen 80;
    listen [::]:80;
    server_name login.psnode.cloud;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name login.psnode.cloud;

    ssl_certificate     /etc/letsencrypt/live/login.psnode.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/login.psnode.cloud/privkey.pem;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# The game's login request (server_data.php and the login page it points to)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /opt/gurotopia/resources/ctx/server.crt;
    ssl_certificate_key /opt/gurotopia/resources/ctx/server.key;

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off; # @note our own gateway on the same machine
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
